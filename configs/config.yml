# =============================================================================
# Plex Releases Summary - Configuration File
# =============================================================================
#
# MINIMAL CONFIGURATION: Only 2 fields are required!
#   - tautulli_url
#   - tautulli_api_key
#
# All other fields have smart defaults and work out of the box.
# Uncomment optional fields ONLY if you want to override defaults.
#
# For full configuration reference, see: CONFIGURATION.md#configuration-fields.
#
# =============================================================================
# CONFIGURATION METHODS:
#
# 1. Environment Variables (Recommended for container deployments):
#    Set in your deployment environment file (example: docker-compose.yml):
#    TAUTULLI_URL=http://tautulli:8181
#    Reference in config.yml: tautulli_url: ${TAUTULLI_URL}
#
# 2. Hardcoded Values (Simple for testing):
#    tautulli_url: http://192.168.1.100:8181
#
# 3. Docker Secrets (Best for production):
#    Set in your deployment environment file (example: docker-compose.yml):
#    TAUTULLI_API_KEY=/run/secrets/tautulli_api_key
#    Reference in config.yml: tautulli_api_key: ${TAUTULLI_API_KEY}
#    The file content is automatically read.
#
# =============================================================================

# -----------------------------------------------------------------------------
# REQUIRED FIELDS
# -----------------------------------------------------------------------------

# Where recently added media is read from: tautulli (default) or tracearr
media_source: ${MEDIA_SOURCE}

# Tracearr instance URL and public API token (required when media_source is tracearr)
# The token is created in Tracearr's UI and looks like trr_pub_...
# Note: Tracearr cannot report the Plex machine identifier, so set plex_server_id
# below if you want clickable media links.
tracearr_url: ${TRACEARR_URL}
tracearr_api_key: ${TRACEARR_API_KEY}

# Tautulli instance URL
# Examples: http://localhost:8181, http://tautulli:8181, https://tautulli.example.com
tautulli_url: ${TAUTULLI_URL}

# Tautulli API key
# Find it in Tautulli: Settings → Web Interface → API Key
# Recommended: Use environment variable or secret for security.
tautulli_api_key: ${TAUTULLI_API_KEY}

# -----------------------------------------------------------------------------
# OPTIONAL FIELDS
# -----------------------------------------------------------------------------
# For full descriptions and examples, see: CONFIGURATION.md#optional-field-overrides.
#
# NOTE: Optional fields below use environment variable references.
#       If you don't set an environment variable:
#       - Undefined: silently uses default value (clean logs).
#       - Empty string (e.g., DAYS_BACK=""): logs WARNING, uses default (possible mistake).
#
#       To override: Just set the environment variable in your deployment environment file
#       (example: docker-compose.yml).
#       No need to edit this file for typical use.

# Number of days to look back for new media releases
# Default: 7
days_back: ${DAYS_BACK}

# CRON schedule for automatic execution
# Default: "0 16 * * SUN" (Sundays at 4 PM in container timezone)
# Timezone: Defaults to UTC. Set TZ environment variable to use local timezone (e.g., TZ=America/New_York).
cron_schedule: ${CRON_SCHEDULE}

# Run mode: true = run once and exit, false = continuous scheduled execution
# Default: false
run_once: ${RUN_ONCE}

# Discord webhook URL for notifications
# Default: None (disabled)
discord_webhook_url: ${DISCORD_WEBHOOK_URL}

# Plex server URL for generating clickable media links
# Default: https://app.plex.tv
plex_url: ${PLEX_URL}

# Plex server machine identifier
# Default: Auto-detected via Tautulli
plex_server_id: ${PLEX_SERVER_ID}

# Logging level
# Default: INFO
log_level: ${LOG_LEVEL}

# Media types to exclude from the summary entirely
# Valid values: movie, show, season, episode, album, track
# Default: none excluded
# Example (skip the music library):
#   excluded_media_types:
#     - track
#     - album
excluded_media_types: ${EXCLUDED_MEDIA_TYPES}

# HTTP health endpoint for container liveness probes (scheduled mode only)
# Default: false (no socket is opened)
enable_healthcheck: ${ENABLE_HEALTHCHECK}

# Interface the health endpoint binds to
# Default: 127.0.0.1 — reachable only from inside the container, which is all the
# Docker HEALTHCHECK needs. Set 0.0.0.0 (and publish the port) only if you want to
# probe it from outside; the endpoint is unauthenticated.
health_host: ${HEALTH_HOST}

# Port for the health endpoint
# Default: 8080
health_port: ${HEALTH_PORT}

# Tautulli API batch size (advanced performance tuning)
# Default: Adaptive (100 for ≤7 days, 200 for ≤30 days, 500 for >30 days)
initial_batch_size: ${INITIAL_BATCH_SIZE}
