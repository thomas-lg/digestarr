# Self-hosted Renovate, replacing Dependabot (thomas-lg/digestarr#174).
#
# It runs as a dedicated GitHub App rather than GITHUB_TOKEN: pull requests opened
# with the workflow token never trigger other workflows, so the required checks
# would stay pending forever and nothing could auto-merge. The App needs
# Contents, Pull requests, Issues and Workflows read & write, plus Checks,
# Commit statuses and Metadata read. Its id and private key live in the
# RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY repository secrets.
#
# The cron is daily so Dependency Dashboard checkboxes and rebases are picked up
# quickly; new update PRs are still gated to Monday mornings by the schedule in
# renovate.json.
#
# Repository policy (what to update, grouping, auto-merge) lives in renovate.json.
# This file only holds the self-hosted settings.
name: Renovate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (no PR, no commit)"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          # The only commands renovate.json may run after an update (postUpgradeTasks).
          RENOVATE_ALLOWED_COMMANDS: '["^python -m pip install --quiet --requirement requirements-dev\\.txt$", "^sh scripts/compile-deps\\.sh$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
