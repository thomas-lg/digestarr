# Lets GitHub merge Dependabot's patch and minor updates into develop on its own,
# once the required checks pass. Major updates are left for manual review, since
# those are the ones that break.
#
# develop requires no approving review, so nothing else gates these merges. That is
# deliberate: develop is not production. A dependency merged here still travels
# through release/* -> main, where a review is mandatory and only an admin bypass
# can publish the latest image.
#
# GitHub gives Dependabot-triggered workflows a read-only token by default, hence
# the explicit permissions block below.
name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      # For grouped updates this reports the highest bump in the group, so a major
      # hiding inside a group still falls through to manual review.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
