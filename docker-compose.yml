services:
  app:
    image: ghcr.io/thomas-lg/digestarr:latest
    container_name: digestarr
    volumes:
      - ./configs:/app/configs:rw
      - ./logs:/app/logs:rw
      - ./secrets:/run/secrets:ro

    # Environment variables for configuration
    # Only 3 required: MEDIA_SOURCE, plus the URL and API key of that source
    # For full configuration options, see: CONFIGURATION.md#environment-variables-and-docker
    environment:
      # ========== REQUIRED ==========
      - MEDIA_SOURCE=tracearr
      - TRACEARR_URL=http://tracearr:3000
      - TRACEARR_API_KEY=/run/secrets/tracearr_api_key
      # Reading from Tautulli (Plex only) instead? Replace the three lines above with:
      #   - MEDIA_SOURCE=tautulli
      #   - TAUTULLI_URL=http://tautulli:8181
      #   - TAUTULLI_API_KEY=/run/secrets/tautulli_api_key

    # -------------------------------------------------------------------------
    # HEALTH ENDPOINT (optional)
    # -------------------------------------------------------------------------
    # The container's own HEALTHCHECK needs nothing here: it probes the endpoint
    # from inside, and health_host defaults to 127.0.0.1 so nothing is exposed.
    #
    # To let an EXTERNAL monitor (Uptime Kuma, Gatus, ...) reach it, add BOTH of
    # these to the environment block above:
    #
    #   - ENABLE_HEALTHCHECK=true
    #   - HEALTH_HOST=0.0.0.0
    #
    # HEALTH_HOST is the part people miss: publishing the port is not enough on
    # its own, because the server would still be bound to the container's own
    # loopback and the mapping has nothing to forward to.
    #
    # Then pick ONE of:
    #
    #   a) Monitor in a container (recommended) — no port mapping at all. Join
    #      this container to the monitor's network and point the monitor at
    #      http://digestarr:8080/health
    #      If the monitor lives in another Compose project, attach to its network
    #      the same way as for Tautulli below:
    #
    #        networks:
    #          - <monitor_project>_default
    #
    #      (a container may join several networks, e.g. Tautulli's and the
    #      monitor's.)
    #
    #   b) Monitor outside Docker — publish the port and use
    #      http://<docker_host>:8080/health
    #
    # ports:
    #   - "8080:8080"
    #
    # The endpoint is UNAUTHENTICATED. It exposes only a status string and the last
    # run timestamp — no config, URLs or credentials — but anyone who can reach the
    # address can read it, so prefer (a) over publishing it to your LAN.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # NETWORKING
    # -------------------------------------------------------------------------
    # This container must reach its media source (Tracearr or Tautulli) by
    # hostname. If that service runs in a separate Compose project, attach this
    # container to its network. Example (replace <source_project> with the
    # actual name, e.g. tracearr):
    #
    #   networks:
    #     - <source_project>_default
    #
    # networks:
    #   <source_project>_default:
    #     external: true
    #
    # If the media source is in the SAME Compose file, add both services to a
    # shared network instead and remove the block above.
    # -------------------------------------------------------------------------

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"

    # Use 'unless-stopped' for scheduled mode (long-running daemon).
    # Use 'on-failure' only if you set run_once: true in config.yml.
    restart: unless-stopped
# Optional: Docker Compose secrets (alternative to volume-mounted secrets)
# Uncomment to use Docker secrets instead of volume-mounted files
# secrets:
#   tracearr_api_key:
#     file: ./secrets/tracearr_api_key
#   discord_webhook:
#     file: ./secrets/discord_webhook
