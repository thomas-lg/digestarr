services:
  app:
    image: ghcr.io/thomas-lg/plex-releases-summary:latest
    container_name: plex-releases-summary
    volumes:
      - ./configs:/app/configs:rw
      - ./logs:/app/logs:rw
      - ./secrets:/run/secrets:ro

    # Environment variables for configuration
    # Only 2 required: TAUTULLI_URL and TAUTULLI_API_KEY
    # For full configuration options, see: CONFIGURATION.md#environment-variables-and-docker
    environment:
      # ========== REQUIRED ==========
      - TAUTULLI_URL=http://tautulli:8181
      - TAUTULLI_API_KEY=/run/secrets/tautulli_api_key

    # -------------------------------------------------------------------------
    # HEALTH ENDPOINT (optional)
    # -------------------------------------------------------------------------
    # The container's own HEALTHCHECK needs nothing here: it probes the endpoint
    # from inside, and health_host defaults to 127.0.0.1 so nothing is exposed.
    #
    # To let an EXTERNAL monitor (Uptime Kuma, Gatus, ...) reach it, the endpoint
    # must bind all interfaces — set ENABLE_HEALTHCHECK=true and HEALTH_HOST=0.0.0.0
    # in the environment block above, then either:
    #
    #   a) publish the port to the host, and point the monitor at <host>:8080/health
    #
    # ports:
    #   - "8080:8080"
    #
    #   b) or, if the monitor runs as a container on the same Docker network, skip
    #      the port mapping and point it at http://plex-releases-summary:8080/health
    #
    # The endpoint is UNAUTHENTICATED. It exposes only a status string and the last
    # run timestamp — no config, URLs or credentials — but anyone who can reach the
    # address can read it.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # NETWORKING
    # -------------------------------------------------------------------------
    # This container must reach the Tautulli service by hostname.
    # If Tautulli runs in a separate Compose project, attach this container to
    # its network.  Example (replace <tautulli_project> with the actual name):
    #
    #   networks:
    #     - <tautulli_project>_default
    #
    # networks:
    #   <tautulli_project>_default:
    #     external: true
    #
    # If Tautulli is in the SAME Compose file, add both services to a shared
    # network instead and remove the block above.
    # -------------------------------------------------------------------------

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"

    # Use 'unless-stopped' for scheduled mode (long-running daemon).
    # Use 'on-failure' only if you set run_once: true in config.yml.
    restart: unless-stopped
# Optional: Docker Compose secrets (alternative to volume-mounted secrets)
# Uncomment to use Docker secrets instead of volume-mounted files
# secrets:
#   tautulli_api_key:
#     file: ./secrets/tautulli_api_key
#   discord_webhook:
#     file: ./secrets/discord_webhook
