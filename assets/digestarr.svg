<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" role="img" aria-label="Digestarr">
  <title>Digestarr</title>
  <!-- Plaque de fond opaque -->
  <circle cx="128" cy="128" r="128" fill="#1C1C1E" />
  <!-- Anneau extérieur signature de la famille -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#3A3A3C" stroke-width="8" />

  <!-- 1. Branche droite et chute (passera sous l'anneau) -->
  <polyline points="192,80 128,160 128,208" fill="none" stroke="#FF9500" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2. Contreforme pour donner l'illusion que l'anneau passe AU-DESSUS de la branche droite -->
  <path d="M 128 52 A 48 48 0 0 1 128 148" fill="none" stroke="#1C1C1E" stroke-width="40" stroke-linecap="butt" />

  <!-- 3. Anneau central complet (vient s'imposer sur la contreforme) -->
  <circle cx="128" cy="100" r="48" fill="none" stroke="#FF3B30" stroke-width="24" />

  <!-- 4. Contreforme pour que la branche gauche passe AU-DESSUS de l'anneau -->
  <line x1="64" y1="80" x2="104" y2="130" stroke="#1C1C1E" stroke-width="40" stroke-linecap="round" />

  <!-- 5. Branche gauche (vient fermer l'entonnoir par-dessus l'anneau) -->
  <line x1="64" y1="80" x2="128" y2="160" stroke="#FF9500" stroke-width="24" stroke-linecap="round" />
</svg>
