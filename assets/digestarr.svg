<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Digestarr">
  <title>Digestarr</title>
  <!--
    Opaque plate. The glyph colours are excellent against each other (9.58:1) but neither
    survives every host background on its own: the navy reads 1.26:1 on a dark Unraid
    dashboard, the cyan 1.41:1 on a light README. The plate decouples the icon from the
    host theme, which is also why every *arr icon is a filled tile.
  -->
  <rect width="256" height="256" rx="48" fill="#2B2D42"/>
  <!--
    The artwork spans y 8..246 unscaled — fine for a free-floating mark, too tight inside
    a tile. 0.8739 about the centre buys ~24px of margin without touching the geometry
    below, so the original coordinates stay readable and editable.
  -->
  <g transform="translate(128,128) scale(0.8739) translate(-128,-128)" fill="#00F0FF">
    <!-- Funnel: fill and stroke share a colour so stroke-linejoin rounds the corners -->
    <polygon points="30,70 226,70 160,160 160,200 96,200 96,160"
             stroke="#00F0FF" stroke-width="24" stroke-linejoin="round"/>
    <!-- Three sources feeding in -->
    <circle cx="70" cy="24" r="16"/>
    <circle cx="128" cy="24" r="16"/>
    <circle cx="186" cy="24" r="16"/>
    <!-- One digest coming out -->
    <rect x="96" y="222" width="64" height="24" rx="12"/>
  </g>
</svg>
